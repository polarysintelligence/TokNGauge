<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#1a1f3a"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Gauge arc background -->
  <path d="M 96 320 A 160 160 0 0 1 416 320"
        fill="none" stroke="#2a3157" stroke-width="32" stroke-linecap="round"/>

  <!-- Gauge arc fill (neon) -->
  <path d="M 96 320 A 160 160 0 0 1 336 184"
        fill="none" stroke="url(#neon)" stroke-width="32" stroke-linecap="round"
        filter="url(#blur)" opacity="0.7"/>
  <path d="M 96 320 A 160 160 0 0 1 336 184"
        fill="none" stroke="url(#neon)" stroke-width="24" stroke-linecap="round"/>

  <!-- Token "cubes" along the arc -->
  <g fill="#22d3ee">
    <rect x="90"  y="305" width="22" height="22" rx="4" transform="rotate(-65 101 316)"/>
    <rect x="155" y="218" width="22" height="22" rx="4" transform="rotate(-40 166 229)" fill="#7dd3fc"/>
    <rect x="245" y="178" width="22" height="22" rx="4" transform="rotate(-10 256 189)" fill="#a855f7"/>
    <rect x="325" y="195" width="22" height="22" rx="4" transform="rotate(25 336 206)" fill="#ec4899"/>
  </g>

  <!-- Needle -->
  <g transform="rotate(-20 256 320)">
    <line x1="256" y1="320" x2="256" y2="170" stroke="#f5f5f5" stroke-width="6" stroke-linecap="round"/>
    <circle cx="256" cy="320" r="14" fill="#f5f5f5"/>
    <circle cx="256" cy="320" r="6" fill="#0b1024"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="420" text-anchor="middle"
        font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" fill="#e6edf3"
        letter-spacing="-2">TokN<tspan fill="#22d3ee">Gauge</tspan></text>
</svg>
